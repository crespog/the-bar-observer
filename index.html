<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Bar Observer — Madrid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f6f8}
#map{height:100%;width:100%}
.header,.filters{position:absolute;z-index:1000;background:rgba(255,255,255,.94);padding:12px 16px;border-radius:12px;box-shadow:0 3px 15px rgba(0,0,0,.12);backdrop-filter:blur(8px)}.header{top:18px;left:18px}
h1{margin:0;font-size:19px;line-height:1;font-weight:800;letter-spacing:-.02em}.filters{top:18px;right:18px;display:flex;align-items:center;gap:9px}.filter-label{color:#4b5563;font-size:12px;font-weight:750}.filter-options{display:flex;gap:5px}.filter-chip{border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#4b5563;padding:5px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s}.filter-chip:hover{border-color:#243b8f;color:#243b8f}.filter-chip[aria-pressed="true"]{background:#243b8f;border-color:#243b8f;color:#fff}@media(max-width:620px){.filters{top:64px;left:18px;right:auto}}
#status{position:absolute;z-index:1000;bottom:18px;left:18px;background:rgba(255,255,255,.94);padding:8px 12px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px;color:#374151;backdrop-filter:blur(8px)}

.leaflet-marker-icon.bar-price-icon{background:transparent;border:0}
.bar-marker-wrap{position:relative;width:92px;height:64px;--dx:0px}
.bar-price{position:absolute;left:50%;top:0;transform:translateX(calc(-50% + var(--dx)));background:#fff;color:#1f2937;border:1px solid #e5e7eb;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:750;line-height:1;white-space:nowrap;box-shadow:0 2px 7px rgba(15,23,42,.16);transition:transform .12s ease}
.bar-price::after{content:"";position:absolute;left:50%;bottom:-8px;width:1px;height:8px;background:#cbd5e1;transform:translateX(-50%)}
.bar-dot{position:absolute;left:50%;top:37px;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#243b8f;border:3px solid #fff;box-shadow:0 0 0 5px rgba(36,59,143,.18),0 2px 5px rgba(15,23,42,.25)}

.bar-cluster{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(36,59,143,.88);border:7px solid rgba(36,59,143,.18);background-clip:padding-box;color:#fff;font-size:15px;font-weight:800;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:transparent}

.leaflet-popup-content-wrapper{border-radius:10px}.leaflet-popup-content{margin:12px 14px}.popup h3{margin:0 0 5px;font-size:17px;color:#111827}.popup .price{font-size:24px;font-weight:800;color:#243b8f;margin-bottom:10px}.popup table{border-collapse:collapse;font-size:13px}.popup td{padding:3px 0}.popup td:first-child{color:#6b7280;padding-right:15px}.popup td:last-child{color:#111827;font-weight:600}.popup a{display:inline-block;margin-top:10px;color:#243b8f;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="header"><h1>The Bar Observer</h1></div>
<div class="filters" role="group" aria-label="Filtrar por formato"><span class="filter-label">Formato</span><div class="filter-options"><button class="filter-chip" type="button" data-format="Caña" aria-pressed="false">Caña</button><button class="filter-chip" type="button" data-format="Doble" aria-pressed="false">Doble</button><button class="filter-chip" type="button" data-format="Tercio" aria-pressed="true">Tercio</button></div></div>
<div id="map"></div>
<div id="status">Cargando datos…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const madridBounds=L.latLngBounds([40.30,-3.90],[40.56,-3.50]);
const map=L.map('map',{maxZoom:18,minZoom:11,maxBounds:madridBounds,maxBoundsViscosity:1,zoomAnimation:true,worldCopyJump:false}).setView([40.4168,-3.7038],12);
L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron',maxZoom:18}).addTo(map);
const status=document.getElementById('status');
// La hoja de cálculo permanece privada. Este endpoint solo publica los campos
// que necesita el mapa, filtrados por el Apps Script de The Bar Observer.
const DATA_ENDPOINT='https://script.google.com/macros/s/AKfycbxtTM_1L7SJLGSbkTMhhudrxvqrP4xlnmrdJa94xQqKa-ZsEYEW6pgNf-Re7VlWa_7o/exec';
const formatButtons=[...document.querySelectorAll('[data-format]')];
let selectedFormats=formatButtons.filter(button=>button.getAttribute('aria-pressed')==='true').map(button=>button.dataset.format);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadBars(){
 try{
   // El parámetro evita reutilizar una respuesta antigua almacenada en caché.
   const response=await fetch(`${DATA_ENDPOINT}?v=${Date.now()}`,{cache:'no-store'});
   if(!response.ok)throw new Error(`El endpoint respondió ${response.status}`);
   const bars=await response.json();
   if(!Array.isArray(bars))throw new Error('El endpoint no devolvió una lista de bares');
   return {bars,source:'Google Sheets'};
 }catch(remoteError){
   // El archivo incluido permite que el mapa siga disponible si Google no responde.
   console.warn('No se pudieron cargar los datos remotos; se usa la copia local.',remoteError);
   const response=await fetch('bars.json',{cache:'no-store'});
   if(!response.ok)throw new Error(`bars.json respondió ${response.status}`);
   return {bars:await response.json(),source:'copia local'};
 }
}

function normalized(value){
 return String(value??'').trim().toLocaleLowerCase('es-ES');
}

// Un bar aparece una sola vez: la medición más barata de los formatos seleccionados.
function visibleBars(records,formats=selectedFormats){
 const selected=new Set(formats.map(normalized));
 const cheapestByBar=new Map();
 for(const bar of records){
   const price=Number(bar.price_eur);
   if(!selected.has(normalized(bar.format))||!Number.isFinite(price))continue;
   const key=normalized(bar.bar)||`${bar.lat},${bar.lon}`;
   const current=cheapestByBar.get(key);
   if(!current||price<Number(current.price_eur))cheapestByBar.set(key,bar);
 }
 return [...cheapestByBar.values()];
}

function popup(b){
 const price=Number(b.price_eur);
 return `<div class="popup"><h3>${esc(b.bar)}</h3><div class="price">${price.toFixed(2).replace('.',',')} €</div><table>
 <tr><td>Bebida</td><td>${esc(b.brand||b.drink_type)}</td></tr>
 <tr><td>Formato</td><td>${esc(b.format)} · ${esc(b.ml)} ml</td></tr>
 <tr><td>Tapa</td><td>${esc(b.tapa)}</td></tr>
 <tr><td>Precio/L</td><td>${esc(b.price_per_l)}</td></tr>
 <tr><td>Medición</td><td>${esc(b.date)}</td></tr></table>
 ${b.google_maps_url?`<a href="${esc(b.google_maps_url)}" target="_blank" rel="noopener">📍 Ver en Google Maps</a>`:''}</div>`;
}

function barIcon(b){
 const price=Number(b.price_eur);
 return L.divIcon({className:'bar-price-icon',html:`<div class="bar-marker-wrap" data-marker="bar"><div class="bar-price">${price.toFixed(2).replace('.',',')} €</div><div class="bar-dot"></div></div>`,iconSize:[92,64],iconAnchor:[46,47],popupAnchor:[0,-47]});
}

const barsLayer=L.markerClusterGroup({
 maxClusterRadius:45,
 disableClusteringAtZoom:17,
 showCoverageOnHover:false,
 spiderfyOnMaxZoom:true,
 zoomToBoundsOnClick:true,
 animate:true,
 animateAddingMarkers:false,
 iconCreateFunction:cluster=>{
   const barCount=new Set(cluster.getAllChildMarkers().map(marker=>marker.barObserverKey)).size;
   return L.divIcon({html:`<div class="bar-cluster">${barCount}</div>`,className:'bar-cluster-icon',iconSize:[46,46],iconAnchor:[23,23]});
 }
});

const markerRecords=[];

// Spread only the PRICE LABELS when two nearby bars would overlap on screen.
// The dots remain on their real geographic positions.
function layoutPriceLabels(){
 const zoom=map.getZoom();
 if(zoom<15) return;
 const placed=[];
 const minGap=52;
 const maxShift=46;
 for(const rec of markerRecords){
   if(!map.hasLayer(rec.marker)) continue;
   const p=map.latLngToLayerPoint(rec.marker.getLatLng());
   let dx=0;
   let tries=0;
   while(tries<8){
     const candidateX=p.x+dx;
     let collision=false;
     for(const other of placed){
       if(Math.abs(candidateX-other.x)<minGap && Math.abs(p.y-other.y)<26){collision=true;break;}
     }
     if(!collision) break;
     dx += (tries%2===0 ? 1 : -1) * Math.ceil((tries+1)/2)*18;
     if(Math.abs(dx)>maxShift){dx=0;break;}
     tries++;
   }
   placed.push({x:p.x+dx,y:p.y});
   const el=rec.marker.getElement();
   if(el){const wrap=el.querySelector('.bar-marker-wrap');if(wrap)wrap.style.setProperty('--dx',dx+'px');}
 }
}

map.on('zoomend moveend',layoutPriceLabels);

let allBars=[];
let dataSource='';

function renderBars({fitMap=false}={}){
 const bars=visibleBars(allBars);
 const bounds=[];
 barsLayer.clearLayers();
 markerRecords.length=0;
 for(const b of bars){
   const lat=Number(b.lat),lon=Number(b.lon);
   if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
   const marker=L.marker([lat,lon],{icon:barIcon(b)}).bindPopup(popup(b));
   marker.barObserverKey=String(b.bar??'').trim().toLocaleLowerCase('es-ES')||`${lat},${lon}`;
   markerRecords.push({marker,b});
   barsLayer.addLayer(marker);
   bounds.push([lat,lon]);
 }
 if(!map.hasLayer(barsLayer))map.addLayer(barsLayer);
 if(fitMap&&bounds.length)map.fitBounds(bounds,{padding:[40,40],maxZoom:15});
 status.textContent=`${bounds.length} bares · ${selectedFormats.join(', ')||'ningún formato'} · ${dataSource}`;
 setTimeout(layoutPriceLabels,150);
}

formatButtons.forEach(button=>button.addEventListener('click',()=>{
 const active=button.getAttribute('aria-pressed')==='true';
 button.setAttribute('aria-pressed',String(!active));
 selectedFormats=formatButtons.filter(item=>item.getAttribute('aria-pressed')==='true').map(item=>item.dataset.format);
 if(allBars.length)renderBars();
}));

(async()=>{
 try{
  const loaded=await loadBars();
  allBars=loaded.bars;
  dataSource=loaded.source;
  map.setMaxBounds(madridBounds);
  renderBars({fitMap:true});
  setTimeout(()=>status.remove(),2500);
 }catch(e){console.error('ERROR CARGANDO LOS DATOS:',e);status.textContent='No se pudieron cargar los datos';}
})();
</script>
</body>
</html>
