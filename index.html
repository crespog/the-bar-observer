<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Bar Observer — Madrid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f7f5ef}
header{padding:18px 22px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}.sub{color:#6b7280;font-size:13px}
#map{height:calc(100vh - 67px);min-height:520px}
.popup h3{margin:0 0 7px;font-size:16px}.popup .price{font-size:24px;font-weight:750;margin:3px 0 8px}.popup .muted{color:#6b7280;font-size:12px}.popup table{border-collapse:collapse;font-size:13px}.popup td{padding:2px 8px 2px 0}.popup td:first-child{color:#6b7280}
#status{position:absolute;z-index:1000;top:82px;left:12px;background:#fff;padding:8px 11px;border:1px solid #ddd;border-radius:8px;font-size:12px;box-shadow:0 1px 4px #0001}
</style>
</head>
<body>
<header><h1>The Bar Observer</h1><div class="sub">Madrid · última medición por bar</div></header>
<div id="status">Cargando bares…</div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([40.4168,-3.7038],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function popup(b){
 return `<div class="popup"><h3>${esc(b.bar)}</h3><div class="price">${b.price_eur.toFixed(2).replace('.',',')} €</div>
 <table><tr><td>Bebida</td><td>${esc(b.brand||b.drink_type)}</td></tr>
 <tr><td>Formato</td><td>${esc(b.format)} · ${esc(b.ml)} ml</td></tr>
 <tr><td>Tapa</td><td>${esc(b.tapa)}</td></tr>
 <tr><td>Precio/L</td><td>${esc(b.price_per_l)}</td></tr>
 <tr><td>Medición</td><td>${esc(b.date)}</td></tr></table></div>`;
}
async function geocode(q){
 const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&q='+encodeURIComponent(q);
 const r=await fetch(u,{headers:{'Accept-Language':'es'}});
 if(!r.ok) throw new Error('geocode');
 const a=await r.json(); return a[0] ? [Number(a[0].lat),Number(a[0].lon)] : null;
}
(async()=>{
 try{
  const bars=await fetch('bars.json').then(r=>r.json());
  let ok=0;
  const bounds=[];
  for(const b of bars){
   try{
    const ll=await geocode(b.address);
    if(!ll) continue;
    const m=L.marker(ll).addTo(map).bindPopup(popup(b));
    bounds.push(ll); ok++;
    await new Promise(r=>setTimeout(r,700));
   }catch(e){}
  }
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30]});
  status.textContent=`${ok} bares · última medición`;
  setTimeout(()=>status.remove(),2500);
 }catch(e){status.textContent='No se pudieron cargar los datos';}
})();
</script>
</body>
</html>
